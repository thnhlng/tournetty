openapi: 3.1.0

# ---------------------------------------------------------------------------
# Tournetty REST-API
#
# Stand: nur die Operationen aus UC-001 (Turnier verwalten). Weitere Use Cases
# ergaenzen Pfade und Schemas in dieser Datei — sie ist als wachsender Spec
# angelegt, nicht als Spec je Use Case.
#
# Konventionen (PROJECT_CONTEXT.md §4.2):
#   * /api/<ressource> im Plural, kebab-case
#   * Verben ausschliesslich ueber HTTP-Methoden — kein /archive im Pfad
#   * Feldnamen englisch, Beschreibungen deutsch (wie im uebrigen Code)
#
# Offene Annahme: Das Login-Verfahren ist im Projekt nicht entschieden
# (PROJECT_CONTEXT.md §9, FR-026, NFR-010). Dieser Spec nimmt ein Bearer-Token
# an. Aendert sich das Verfahren, ist nur `securitySchemes` zu ersetzen.
# ---------------------------------------------------------------------------

info:
  title: Tournetty API
  version: 0.1.0
  summary: Turnierplanung fuer Plausch-Volleyball-Turniere
  description: |
    REST-Schnittstelle von Tournetty. Dieser Stand deckt ausschliesslich
    [UC-001 · Turnier verwalten](../use-cases/uc-001-turnier-verwalten.md) ab.

    **Abgedeckte Anforderungen:** FR-001 (CRUD Turnier), FR-005 (eindeutige
    Identitaet), FR-018 (Administrations-Uebersicht), NFR-002
    (Nachrechenbarkeit), NFR-010 (authentifizierte Schreibzugriffe), NFR-014
    (Append-only-Protokoll), NFR-020 (verstaendliche Fehler).

    **Nicht hier:** Spielfelder (UC-004), Turnierregeln (UC-005), Phasen
    (UC-006), Spielplan (UC-007). Ein Turnier wird angelegt, danach uebernehmen
    diese Use Cases.

    ### Nebenlaeufigkeit

    Jedes Turnier traegt ein Feld `version`, das der Server bei jeder Aenderung
    erhoeht. Schreibende Operationen senden die Version mit, von der der
    Aufrufer ausgegangen ist. Weicht sie vom aktuellen Stand ab, antwortet der
    Server mit `409` und dem Code `VERSION_CONFLICT`, ohne etwas zu aendern
    (UC-001 A8).

    ### Fehlerformat

    Alle Fehlerantworten folgen RFC 9457 (`application/problem+json`) und
    tragen einen stabilen `code`, bei Feldfehlern zusaetzlich `errors[]` mit
    dem betroffenen Feld. Stacktraces werden nie ausgeliefert (NFR-020).
  contact:
    name: Organisationsteam Tournetty

servers:
  - url: https://tournetty.herokuapp.com
    description: Produktion (Heroku, C-006)
  - url: http://localhost:8080
    description: lokale Entwicklung

security:
  - bearerAuth: []

tags:
  - name: Tournaments
    description: |
      Turnier-Stammdaten. Alle Operationen setzen eine angemeldete
      Organisator:in voraus (UC-019, FR-026); Teams haben keinen Login (C-013)
      und Vorort-Mitarbeitende keinen Zugriff auf Stammdaten (UC-001 BR-009).

paths:
  /api/tournaments:
    get:
      tags: [Tournaments]
      operationId: listTournaments
      summary: Turniere auflisten
      description: |
        Liefert die Turniere der Arbeitsansicht — UC-001 Schritt 2.

        Standardmaessig erscheinen nur aktive Turniere (`PLANNING`, `RUNNING`,
        `FINISHED`). Archivierte Turniere sind ausschliesslich ueber den
        Filter `status=ARCHIVED` erreichbar (BR-008).

        Eine leere Liste ist kein Fehler, sondern UC-001 A7.
      parameters:
        - $ref: '#/components/parameters/statusFilter'
      responses:
        '200':
          description: Liste der Turniere, nach Datum absteigend sortiert
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tournament'
              examples:
                zweiTurniere:
                  summary: zwei aktive Turniere
                  value:
                    - id: 42
                      version: 7
                      name: Plauschturnier Herbst
                      date: '2026-09-19'
                      location: Sporthalle Wankdorf, Bern
                      status: PLANNING
                    - id: 41
                      version: 3
                      name: Plauschturnier Fruehling
                      date: '2026-04-11'
                      location: Turnhalle Lerbermatt, Koeniz
                      status: FINISHED
                keineTurniere:
                  summary: UC-001 A7 — kein aktives Turnier vorhanden
                  value: []
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Tournaments]
      operationId: createTournament
      summary: Turnier erstellen
      description: |
        Legt ein Turnier an — UC-001 Hauptszenario Schritte 5 bis 8.

        Der Server vergibt die ID (BR-001), setzt den Status auf `PLANNING`,
        validiert Name, Datum und Ort serverseitig (BR-005) und protokolliert
        die Anlage (BR-004).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentCreateRequest'
            examples:
              standard:
                value:
                  name: Plauschturnier Herbst
                  date: '2026-09-19'
                  location: Sporthalle Wankdorf, Bern
      responses:
        '201':
          description: Turnier angelegt
          headers:
            Location:
              description: Pfad des angelegten Turniers
              schema:
                type: string
                format: uri-reference
                examples: ['/api/tournaments/42']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
              examples:
                angelegt:
                  value:
                    id: 42
                    version: 1
                    name: Plauschturnier Herbst
                    date: '2026-09-19'
                    location: Sporthalle Wankdorf, Bern
                    status: PLANNING
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            Name und Kalenderjahr sind bereits vergeben — UC-001 A5, BR-002.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                nameVergeben:
                  value:
                    type: 'https://tournetty.ch/problems/tournament-name-taken'
                    title: Turniername im selben Jahr bereits vergeben
                    status: 409
                    code: TOURNAMENT_NAME_TAKEN
                    detail: >-
                      Fuer 2026 existiert bereits das Turnier
                      "Plauschturnier Herbst" vom 19.09.2026.
                    instance: /api/tournaments
                    errors:
                      - field: name
                        code: NOT_UNIQUE_IN_YEAR
                        message: Waehle einen anderen Namen oder ein anderes Jahr.
                    conflictingTournamentId: 42

  /api/tournaments/{tournamentId}:
    parameters:
      - $ref: '#/components/parameters/tournamentId'

    get:
      tags: [Tournaments]
      operationId: getTournament
      summary: Turnier lesen
      description: |
        Liefert ein einzelnes Turnier samt aktueller `version`. Das Ergebnis
        ist die Grundlage fuer `PATCH` und `DELETE`: die gelesene `version`
        wird dort mitgesendet.

        Archivierte Turniere sind lesbar (BR-007).
      responses:
        '200':
          description: Turnier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Tournaments]
      operationId: updateTournament
      summary: Turnier bearbeiten oder archivieren
      description: |
        Teilaenderung der Turnier-Stammdaten. Nur die mitgesendeten Felder
        werden geaendert; `version` ist immer Pflicht.

        Diese Operation deckt zwei Faelle aus UC-001 ab:

        * **A1 Bearbeiten** — Name, Datum oder Ort aendern. Die ID ist
          unveraenderlich (BR-001).
        * **A4 Archivieren** — `status` auf `ARCHIVED` setzen. Danach ist das
          Turnier lesbar, aber nicht mehr bearbeitbar (BR-007); jeder weitere
          `PATCH` antwortet mit `409 TOURNAMENT_ARCHIVED`.

        **Datumsaenderung mit bestehendem Spielplan (A2):** Existieren bereits
        Partien, verweigert der Server die Aenderung mit
        `409 SCHEDULE_SHIFT_REQUIRES_CONFIRMATION` und nennt die Zahl der
        betroffenen Partien. Erst ein erneuter Aufruf mit
        `confirmScheduleShift: true` verschiebt die Zeitfenster als Ganzes;
        Paarungen und Feldzuteilung bleiben unveraendert (BR-006).

        Jede Aenderung wird protokolliert (BR-004).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentUpdateRequest'
            examples:
              ortKorrigieren:
                summary: A1 — Ort korrigieren
                value:
                  version: 7
                  location: Sporthalle Wankdorf, Bern
              datumVerschieben:
                summary: A2 — Datum aendern, Verschiebung bestaetigt
                value:
                  version: 7
                  date: '2026-09-26'
                  confirmScheduleShift: true
              archivieren:
                summary: A4 — Turnier mit Ergebnissen archivieren
                value:
                  version: 7
                  status: ARCHIVED
      responses:
        '200':
          description: Turnier geaendert, `version` erhoeht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
              examples:
                geaendert:
                  value:
                    id: 42
                    version: 8
                    name: Plauschturnier Herbst
                    date: '2026-09-19'
                    location: Sporthalle Wankdorf, Bern
                    status: PLANNING
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Die Aenderung ist im aktuellen Zustand nicht zulaessig. Der Code
            benennt den Grund; in allen Faellen bleibt das Turnier unveraendert.

            | Code | Fall |
            | --- | --- |
            | `VERSION_CONFLICT` | fremde Aenderung seit dem Lesen (A8) |
            | `TOURNAMENT_NAME_TAKEN` | Name im Jahr vergeben (A5, BR-002) |
            | `SCHEDULE_SHIFT_REQUIRES_CONFIRMATION` | Datumsaenderung trifft bestehenden Spielplan (A2) |
            | `TOURNAMENT_ARCHIVED` | archiviertes Turnier ist nicht bearbeitbar (BR-007) |
            | `UNSUPPORTED_STATUS_TRANSITION` | Statuswechsel ausser `ARCHIVED` ist nicht Sache von UC-001 |
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                versionConflict:
                  summary: A8 — zwischenzeitlich geaendert
                  value:
                    type: 'https://tournetty.ch/problems/version-conflict'
                    title: Turnier wurde zwischenzeitlich geaendert
                    status: 409
                    code: VERSION_CONFLICT
                    detail: >-
                      Erwartete Version 7, aktuell ist Version 8. Lade das
                      Turnier neu und wiederhole die Aenderung.
                    instance: /api/tournaments/42
                    currentVersion: 8
                scheduleShift:
                  summary: A2 — Bestaetigung fehlt
                  value:
                    type: 'https://tournetty.ch/problems/schedule-shift-requires-confirmation'
                    title: Datumsaenderung verschiebt den bestehenden Spielplan
                    status: 409
                    code: SCHEDULE_SHIFT_REQUIRES_CONFIRMATION
                    detail: >-
                      Fuer dieses Turnier sind 36 Partien angesetzt. Ihre
                      Zeitfenster werden mitverschoben; Paarungen und
                      Feldzuteilung bleiben unveraendert. Wiederhole den
                      Aufruf mit confirmScheduleShift: true.
                    instance: /api/tournaments/42
                    affectedMatches: 36
                archiviert:
                  summary: BR-007 — archiviertes Turnier
                  value:
                    type: 'https://tournetty.ch/problems/tournament-archived'
                    title: Archiviertes Turnier ist nicht bearbeitbar
                    status: 409
                    code: TOURNAMENT_ARCHIVED
                    detail: >-
                      Das Turnier ist archiviert. Seine Daten bleiben lesbar
                      und nachrechenbar, aber nicht aenderbar.
                    instance: /api/tournaments/41

    delete:
      tags: [Tournaments]
      operationId: deleteTournament
      summary: Turnier loeschen
      description: |
        Loescht das Turnier mit allen abhaengigen Objekten — Teams, Gruppen,
        Spielfelder, Phasen, Partien und offene Anmeldungen (UC-001 A3).

        **Nur solange kein Ergebnis erfasst ist (BR-003).** Liegt mindestens
        ein Ergebnis vor, antwortet der Server mit
        `409 TOURNAMENT_HAS_RESULTS` und loescht nichts; an die Stelle des
        Loeschens tritt dann die Archivierung ueber `PATCH` mit
        `status: ARCHIVED` (A4). Ein generierter, aber noch nicht gespielter
        Spielplan verhindert das Loeschen nicht.

        Die Loeschung wird mit ID und Name protokolliert; der Protokolleintrag
        ueberlebt das Turnier (BR-004, NFR-014). Die ID wird nicht
        wiederverwendet (BR-001).
      parameters:
        - $ref: '#/components/parameters/expectedVersion'
      responses:
        '204':
          description: Turnier und abhaengige Objekte geloescht
        '400':
          description: |
            `version` fehlt. Loeschen ohne Versionsangabe wird abgelehnt,
            damit kein Turnier geloescht wird, in das zwischenzeitlich ein
            Ergebnis eingetragen wurde.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                versionFehlt:
                  value:
                    type: 'https://tournetty.ch/problems/validation-failed'
                    title: Pflichtangabe fehlt
                    status: 400
                    code: VALIDATION_FAILED
                    detail: Der Query-Parameter version ist erforderlich.
                    instance: /api/tournaments/42
                    errors:
                      - field: version
                        code: REQUIRED
                        message: Erwartete Version des Turniers angeben.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            | Code | Fall |
            | --- | --- |
            | `TOURNAMENT_HAS_RESULTS` | Ergebnisse erfasst — archivieren statt loeschen (BR-003, A4) |
            | `VERSION_CONFLICT` | fremde Aenderung seit dem Lesen (A8) |
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ergebnisseVorhanden:
                  summary: BR-003 — Loeschen ausgeschlossen
                  value:
                    type: 'https://tournetty.ch/problems/tournament-has-results'
                    title: Turnier mit erfassten Ergebnissen
                    status: 409
                    code: TOURNAMENT_HAS_RESULTS
                    detail: >-
                      Fuer dieses Turnier sind 12 Ergebnisse erfasst. Gespielte
                      Turniere bleiben nachrechenbar und werden nicht geloescht
                      — archiviere es stattdessen ueber PATCH mit
                      status ARCHIVED.
                    instance: /api/tournaments/41
                    recordedResults: 12

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token aus der Anmeldung (UC-019, FR-026). **Annahme** — das
        Login-Verfahren ist noch nicht entschieden (PROJECT_CONTEXT.md §9).

        Nach fuenf Fehlversuchen wird das Konto fuer 15 Minuten gesperrt
        (NFR-010); das betrifft den Anmelde-Endpunkt, der hier noch nicht
        beschrieben ist.

  parameters:
    tournamentId:
      name: tournamentId
      in: path
      required: true
      description: Eindeutige, unveraenderliche ID des Turniers (BR-001, FR-005)
      schema:
        type: integer
        format: int64
        minimum: 1
      examples:
        standard:
          value: 42

    statusFilter:
      name: status
      in: query
      required: false
      description: |
        Filter auf den Turnierstatus. Mehrfach angebbar. Ohne Angabe liefert
        die Liste `PLANNING`, `RUNNING` und `FINISHED` — archivierte Turniere
        nur auf ausdrueckliche Anfrage (BR-008).
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items:
          $ref: '#/components/schemas/TournamentStatus'
      examples:
        archiv:
          summary: Archivfilter
          value: [ARCHIVED]

    expectedVersion:
      name: version
      in: query
      required: true
      description: |
        Version, von der der Aufrufer ausgeht. Weicht sie vom aktuellen Stand
        ab, antwortet der Server mit `409 VERSION_CONFLICT` und loescht nichts
        (A8).
      schema:
        type: integer
        format: int32
        minimum: 1
      examples:
        standard:
          value: 7

  schemas:
    TournamentStatus:
      type: string
      description: |
        Lebenszyklus eines Turniers.

        * `PLANNING` — angelegt, Spielplan noch nicht in Betrieb. Status beim
          Erstellen.
        * `RUNNING` — Turniertag laeuft, Ergebnisse werden erfasst.
        * `FINISHED` — alle Partien gespielt.
        * `ARCHIVED` — aus der Arbeitsansicht entfernt, lesbar und
          nachrechenbar, nicht mehr bearbeitbar (BR-007, BR-008).

        **Offen:** Wer die Uebergaenge `PLANNING` → `RUNNING` → `FINISHED`
        setzt, ist nicht entschieden (PROJECT_CONTEXT.md §9). UC-001 setzt
        beim Anlegen `PLANNING` und erlaubt als Wechsel nur `ARCHIVED`.
      enum: [PLANNING, RUNNING, FINISHED, ARCHIVED]

    Tournament:
      type: object
      description: Ein Turnier als eigenstaendiger, referenzierbarer Anlass (FR-001, FR-005)
      required: [id, version, name, date, location, status]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: |
            Systemweit eindeutig, vom Server vergeben, nie geaendert und nach
            einer Loeschung nicht wiederverwendet (BR-001).
          examples: [42]
        version:
          type: integer
          format: int32
          readOnly: true
          minimum: 1
          description: |
            Aenderungszaehler. Bei jeder Aenderung erhoeht; schreibende
            Operationen senden ihn mit, um fremde Aenderungen zu erkennen (A8).
          examples: [7]
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            Fachlicher Name. Zusammen mit dem Kalenderjahr von `date`
            eindeutig; verglichen wird ohne Ruecksicht auf Gross- und
            Kleinschreibung und ohne umschliessende Leerzeichen (BR-002).
          examples: [Plauschturnier Herbst]
        date:
          type: string
          format: date
          description: |
            Turnierdatum. Ein Datum in der Vergangenheit ist zulaessig —
            Turniere werden auch nachtraeglich erfasst (BR-005).
          examples: ['2026-09-19']
        location:
          type: string
          minLength: 1
          maxLength: 120
          description: Austragungsort als Freitext
          examples: [Sporthalle Wankdorf, Bern]
        status:
          $ref: '#/components/schemas/TournamentStatus'

    TournamentCreateRequest:
      type: object
      description: |
        Stammdaten beim Anlegen (UC-001 Schritt 5). ID, Version und Status
        vergibt der Server; Spielfelder, Regeln und Phasen gehoeren zu
        UC-004, UC-005 und UC-006.
      required: [name, date, location]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          examples: [Plauschturnier Herbst]
        date:
          type: string
          format: date
          examples: ['2026-09-19']
        location:
          type: string
          minLength: 1
          maxLength: 120
          examples: [Sporthalle Wankdorf, Bern]

    TournamentUpdateRequest:
      type: object
      description: |
        Teilaenderung. Nur mitgesendete Felder werden geaendert, `version` ist
        immer Pflicht. Mindestens ein aenderbares Feld muss dabei sein; ein
        Rumpf mit `version` allein ergibt `400 VALIDATION_FAILED`.
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
          description: Version, von der der Aufrufer ausgeht (A8)
          examples: [7]
        name:
          type: string
          minLength: 1
          maxLength: 120
        date:
          type: string
          format: date
        location:
          type: string
          minLength: 1
          maxLength: 120
        status:
          description: |
            Zulaessig ist allein `ARCHIVED` (A4). Jeder andere Wert ergibt
            `409 UNSUPPORTED_STATUS_TRANSITION` — die uebrigen Uebergaenge
            sind nicht Sache von UC-001.
          type: string
          enum: [ARCHIVED]
        confirmScheduleShift:
          type: boolean
          default: false
          description: |
            Bestaetigt, dass eine Datumsaenderung die Zeitfenster eines
            bestehenden Spielplans mitverschieben darf (A2, BR-006). Wird
            nicht gespeichert. Ohne bestehenden Spielplan ohne Wirkung.

    Problem:
      type: object
      description: |
        Fehlerobjekt nach RFC 9457, erweitert um einen stabilen `code` und
        Feldfehler. Enthaelt nie einen Stacktrace (NFR-020).
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: Stabile URI des Fehlertyps
          examples: ['https://tournetty.ch/problems/validation-failed']
        title:
          type: string
          description: Kurze, menschenlesbare Bezeichnung des Fehlertyps
        status:
          type: integer
          description: HTTP-Statuscode, wiederholt im Rumpf
          examples: [400]
        code:
          type: string
          description: |
            Stabiler Fehlercode zur Auswertung im Frontend. Aendert sich nicht
            mit dem Meldungstext.
          enum:
            - VALIDATION_FAILED
            - TOURNAMENT_NAME_TAKEN
            - VERSION_CONFLICT
            - SCHEDULE_SHIFT_REQUIRES_CONFIRMATION
            - TOURNAMENT_HAS_RESULTS
            - TOURNAMENT_ARCHIVED
            - UNSUPPORTED_STATUS_TRANSITION
            - UNAUTHENTICATED
            - NOT_FOUND
        detail:
          type: string
          description: Erklaerung dieses konkreten Vorfalls
        instance:
          type: string
          format: uri-reference
          description: Pfad, auf den sich der Fehler bezieht
        errors:
          type: array
          description: Feldbezogene Fehler, falls die Ursache Eingabefelder betrifft
          items:
            $ref: '#/components/schemas/FieldError'
        currentVersion:
          type: integer
          format: int32
          description: Nur bei `VERSION_CONFLICT` — der tatsaechliche Stand
        affectedMatches:
          type: integer
          description: Nur bei `SCHEDULE_SHIFT_REQUIRES_CONFIRMATION`
        recordedResults:
          type: integer
          description: Nur bei `TOURNAMENT_HAS_RESULTS`
        conflictingTournamentId:
          type: integer
          format: int64
          description: Nur bei `TOURNAMENT_NAME_TAKEN` — das kollidierende Turnier

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Betroffenes Feld des Anfragerumpfs
          examples: [name]
        code:
          type: string
          description: Stabiler Grund
          enum: [REQUIRED, TOO_LONG, INVALID_DATE, NOT_UNIQUE_IN_YEAR, BLANK]
        message:
          type: string
          description: Hinweis fuer die Anzeige im Formular

  responses:
    Unauthorized:
      description: |
        Nicht angemeldet oder Token abgelaufen. Schreibende Endpunkte sind
        authentifiziert (NFR-010); UC-001 setzt UC-019 voraus.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            nichtAngemeldet:
              value:
                type: 'https://tournetty.ch/problems/unauthenticated'
                title: Nicht angemeldet
                status: 401
                code: UNAUTHENTICATED
                detail: Melde dich an, um Turniere zu verwalten.

    NotFound:
      description: |
        Kein Turnier mit dieser ID. Auch nach einer Loeschung — IDs werden
        nicht wiederverwendet (BR-001).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unbekannt:
              value:
                type: 'https://tournetty.ch/problems/not-found'
                title: Turnier nicht gefunden
                status: 404
                code: NOT_FOUND
                detail: Es existiert kein Turnier mit der ID 999.
                instance: /api/tournaments/999

    ValidationFailed:
      description: |
        Unvollstaendige oder unplausible Eingaben — UC-001 A6, BR-005,
        NFR-020. Je betroffenem Feld wird der Grund genannt; das Turnier
        bleibt unveraendert.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            mehrereFelder:
              value:
